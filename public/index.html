<!doctype html>
<html ng-app="myApp" ng-controller="myCtrl">

<head>
    <meta charset="utf-8">
    <title>Books Manager</title>

    <!-- ✅ Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ✅ Angular -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.2/angular.min.js"></script>
    <script src="script.js"></script>
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4 text-primary">📚 Book Manager</h2>

    <!-- ✅ Add Book Card -->
    <div class="card shadow p-4 mb-5">
        <h4 class="mb-3">Add New Book</h4>

        <div class="row">
            <div class="col-md-3">
                <input type="text" class="form-control" placeholder="Book Name" ng-model="Name">
            </div>

            <div class="col-md-2">
                <input type="text" class="form-control" placeholder="ISBN" ng-model="Isbn">
            </div>

            <div class="col-md-3">
                <input type="text" class="form-control" placeholder="Author" ng-model="Author">
            </div>

            <div class="col-md-2">
                <input type="number" class="form-control" placeholder="Pages" ng-model="Pages">
            </div>

            <div class="col-md-2">
                <button class="btn btn-success w-100" ng-click="add_book()">
                    ➕ Add
                </button>
            </div>
        </div>
    </div>

    <!-- ✅ Book Table -->
    <div class="card shadow p-4">
        <h4 class="mb-3">Book List</h4>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Action</th>
                    <th>Name</th>
                    <th>ISBN</th>
                    <th>Author</th>
                    <th>Pages</th>
                </tr>
            </thead>

            <tbody>
                <tr ng-repeat="book in books track by $index">
                    <td>
                        <button class="btn btn-danger btn-sm"
                            ng-click="del_book(book)">
                            ❌ Delete
                        </button>
                    </td>
                    <td>{{book.name}}</td>
                    <td>{{book.isbn}}</td>
                    <td>{{book.author}}</td>
                    <td>{{book.pages}}</td>
                </tr>
            </tbody>
        </table>

        <!-- ✅ Empty State -->
        <div ng-if="books.length === 0" class="text-center text-muted">
            No books added yet.
        </div>
    </div>

</div>

</body>
</html>
